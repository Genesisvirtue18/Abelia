sky-deep",solid:"bg-sky"}},Jt=[{slug:"hemstading",name:"Hemstädning",short:"Din vardagsstädning – planerad, löpande eller enskild.",tagline:"Kamma hem och ta helgen. Vi städar, du får tiden tillbaka.",priceNote:"312,25 kr/tim eller 45 kr/m² med RUT",img:"https://images.pexels.com/photos/7641347/pexels-photo-7641347.jpeg?auto=compress&cs=tinysrgb&fit=crop&h=627&w=1200",accent:"sage",icon:"home",duration:"1–3 h per städning",intro:["Vår hemstädning är den tjänst allra flest av våra kunder börjar med. En eller två utbildade städare kommer med eget material och maskiner och går igenom hela hemmet enligt vår detaljerade checkliste – från dammtorkning och dammsugning till disk, duschväggar och toaletter.","Beställ en enskild städning inför en fest eller sätt upp en löpande rutin som passar ditt liv. Vid löpande städning får du samma städlag, fasta tider och samma transparenta pris per timme eller kvadratmeter."],includes:["Dammsugning & dammtorkning av alla ytor","Disk & diskbänk, spishäll & köksarbetsytor","Duschväggar, toalett & handfat","Städning av kalla ytor i kök & badrum","Golvstvädning i vått rum","Sömgodkännande – du kan kolla genom efteråt"],goodFor:["Vardagslyft","Löpande rutin","Förfest & -kväll","Hyresavlämning"],process:["Vi bokar en tid som passar dig","Städlaget kommer med allt material","Vi städar enligt checklistan, rum för rum","Du godkänner – 7 dagars garanti gäller"],faqs:[{q:"Måste jag vara hemma under städningen?",a:"Nej. De flesta av våra kunder väljer färdigkod eller utlämnar nyckel. Du får en bekräftelse med städlagets namn och bild innan besöket så du alltid vet vem som kommer."},{q:"Vilka städmedel använder ni?",a:"Vi städar med certifierade, miljömärkta produkter. Har du egna medel eller vill du ha en extra doft i hemmet – säg till, vi tar med det."},{q:"Hur lång tid tar en städning av tvåa eller trea?",a:"En tvåa tar oftast cirka 1,5 timmar och en trea runt 2–2,5 timmar, beroende på tillstånd. Vid första städningen kan det ta lite längre om hemmet behöver ett grundläggande lyft."}]},{slug:"kontorstading",name:"Kontorstädning",short:"Rens arbetsplats med fast schema – kvällar, nätter eller dagtid.",tagline:"Ett fräscht kontor får ditt team att må bättre. Vi fixar rytmen.",priceNote:"624,50 kr/tim eller 90 kr/m² utan RUT",img:"https://images.pexels.com/photos/36303748/pexels-photo-36303748.jpeg?auto=compress&cs=tinysrgb&fit=crop&h=627&w=1200",accent:"sky",icon:"office",duration:"2–4 h per tillfälle",intro:["Vi städar allt från enstaka hemmakontor till kontorsvåningar och lokaler. Skicket lägger vi upp tillsammans med dig: skrivbord och möten i skuggan av personalen, toaletter och disk på kvällen eller natten – hur som passar din verksamhet.","För företag ger vi faktura med dragrätt och fast pris per tillfälle, så du slipser budgetöverraskningar. Vi tar även hand om entréer, hissar och gemensamma utrymmen om ni har ett gemensamt avtal med fastighetsägaren."],includes:["Skrivbord, fönsterbrädor & arbetsytor","Toaletter & kök: rengöring & påfyllning","Dammsugning av mattor & kargolv","Skyltar, dörrar & knoppar","Kylskåpskontroll & sopsortering","Rapporter & checklista per tillfälle"],goodFor:["Kontor & byråer","Butiker & lokaler","Skolor & förskolor","Vård & rehab"],process:["Genomgång av lokalen & önskemål","Fast pris & schema som passar er","Städning enligt er checklista","Månadlig uppföljning & justering"],faqs:[{q:"Kan ni städa utanför kontorstid?",a:"Absolut – det är oftast det som fungerar bäst. Vi städar kvällar, nätter och helger med färdigkod eller nyckelförvaring. Larm anpassas efter era regler."},{q:"Hur snabbt kan vi komma igång?",a:"De flesta nya kunder är igång inom 3–5 arbetsdagar. Behöver det gå snabbare kan vi ofta lösa det – hör av dig."},{q:"Får vi faktura med dragrätt?",a:"Ja, alltid. Vi skickar faktura med dragrätt och löpande avtal, och ni kan säga upp med 30 dagars varsel."}]},{slug:"fonsterputsning",name:"Fönsterputsning",short:"Inga spår, inga droppar – bara ljus.",tagline:"Ljuset tillbaka i hemmet. Vi putsar glas, ramar och brädor.",priceNote:"312,25 kr/tim eller 45 kr/m² med RUT",img:"https://images.pexels.com/photos/4239145/pexels-photo-4239145.jpeg?auto=compress&cs=tinysrgb&fit=crop&h=627&w=1200",accent:"lav",icon:"window",duration:"1–2 h per bostad",intro:["Rena fönster förändrar hela rummet. Vi putsar alla utrymmesglas, karmar, brädor och ramar – baksidan med fönsterputsar och framsidan med mjukduk, för en spårfri yta.","Tjänsten passar utmärkt som tillägg till en hemstädning eller som egentillfälle inför sommaren. Vid löpande hemstädning ingår en fri fönsterputsning per år."],includes:["Utrymmesglas, framsida & baksida","Fönsterkarmar, ramar & brädor","Dörrglas & speglar i våtrum","Inga spår – vi kontrollerar varje ruta","Kombinera enkelt med hemstädning i samma offert","Fri putsning ingår i löpande hemstädpaket"],goodFor:["Bostad & villa","Butiksfasader","Kontor","Föreningar"],process:["Vi bokar en tid – gärna med hemstädning","Vi börjar uppe och arbetar oss ner","Ramar & brädor rengörs noggrant","Slutkontroll i dagsljus, ruta för ruta"],faqs:[{q:"Putsar ni även utvändigt?",a:"För villor med trädgårdssida och butiker med fasadglas erbjuder vi utvändig putsning med stång och vatten – pris efter höjd och glasarea."},{q:"Vad kostar putsning av en vanlig tvåa?",a:"Priset beräknas i formuläret: 312,25 kr per timme eller 45 kr per m² med RUT. Utan RUT är priset exakt det dubbla."},{q:"Fungerar det även med flyttglas och spegelglas?",a:"Ja, vi hanterar flyttglas, spegelglas och karmar i aluminium och trä. Specialglas markerar vi i förväg."}]},{slug:"flyttningsstading",name:"Flyttningsstädning",short:"Bostaden i skick för nyckel – och depositumet säkrat.",tagline:"Flyttar du? Vi städar så att nyckeln – och depositionen – landar hos dig.",priceNote:"312,25 kr/tim eller 45 kr/m² med RUT",img:"https://images.pexels.com/photos/4498122/pexels-photo-4498122.jpeg?auto=compress&cs=tinysrgb&fit=crop&h=627&w=1200",accent:"butter",icon:"box",duration:"3–5 h beroende på storlek",intro:["Efter en flytt kräver bostaden en ordentlig grundstädning – inuti skåp och ugn, bakom spis, bakom handfat och i hörnen som vardagen aldrig når. Vår flyttningsstädning gör bostaden fotogen och redo för nyckel.","Arbetet utförs enligt vår 60-punktarschecklista och vi lämnar en städbeskrivning som du kan visa upp vid överlåtelse. Har din hyresvärd egna krav – skicka dem till oss så tar vi med dem."],includes:["Inuti skåp, ugn & kyl (tomt innehåll)","Bakom spis, handfat & tvättmaskin","Alla väggar, lister & fönster","Golv: dammsug & städa i vått rum","Toalett & handfat – kalk & beläggning bort","Städbeskrivning för överlämning"],goodFor:["Hyresavlämning","Nyckelväska","Samma-dagsflytt","Försäljning av bostad"],process:["Du berättar bostadens storlek & skick","Fast pris & tid – ofta inom 48 h","Vi städar enligt 60-punkterschecklista","Städbeskrivning + 7 dagars garanti"],faqs:[{q:"Hinner ni städa om vi flyttar imorgon?",a:"Ofta ja. Ring eller skicka en meddelande på morgonen – vi har flexibla tider och kan oftast boka in samma dag eller nästa dag."},{q:"Måste allting vara bortpackat?",a:"Bästa resultatet får vi med en tom bostad, men vi städar även med resterande möbler – vi flyttar på det vi behöver."},{q:"Vad kostar det för en trea på 60 m²?",a:"Ange bostadens yta och välj prismodell i formuläret. Priset är 45 kr per m² eller 312,25 kr per timme med RUT, och exakt det dubbla utan RUT."}]},{slug:"stortstading",name:"Stortstädning",short:"Hos oss – grundputsning av allt, från taklist till golv.",tagline:"En storstädning ger hemmet – och hjärnan – ett nytt startläge.",priceNote:"312,25 kr/tim eller 45 kr/m² med RUT",img:"https://images.pexels.com/photos/4098925/pexels-photo-4098925.jpeg?auto=compress&cs=tinysrgb&fit=crop&h=627&w=1200",accent:"blush",icon:"deep",duration:"3–6 h beroende på storlek",intro:["En storstädning går betydligt djupare än en vanlig städning. Vi tar bort kalk i badrumsrummet, rengör inuti skåp och ugn, städar bakom möblerna och ger taklister och väggarna ett fräsch utseende.","Många av våra kunder beställer en storstädning inför jul, sommarnöje eller som första steg innan löpande hemstädning. Resultatet: ett hem som känns nytt – utan att du behöver röra en mopp."],includes:["Kalk & beläggning ur dusch & handfat","Ugn, kyl & skåp inuti","Väggar, lister, tak & fönster","Golv: grundputsning & maskin på begäran","Skorsten & ventilation","Batterier, ventiler & ljusarmaturer"],goodFor:["Inför jul","Sommarnöje","Före löpande avtal","Våra bostäder"],process:["Skicka bostadsuppgifter – vi räknar priset","Bokar en tid med 2–3 städare","Grundputsning enligt checklistan","Går igenom med dig – garanti 7 dagar"],faqs:[{q:"Vad är skillnaden mot hemstädning?",a:"Hemstädning underhåller, storstädning renoverar. Vi rengör ytor som sällan nås – inuti skåp, bakom ugnen, kalk i badrumsrummet – och jobbar med 2–3 personer för ett effektivt resultat."},{q:"Kan ni maskinrengöra mattor och golv?",a:"Ja, vi har maskiner för mattor, möbler och hårda golv. Lägg till maskinrengöring i formuläret så tar vi med omfattningen i den skriftliga bekräftelsen."},{q:"Hur ofta bör jag storstäda?",a:"1–2 gånger per år räcker för de flesta hushåll. Börja inför jul eller vår – så håller hemmet skicket mellan städningarna."}]},{slug:"byggstading",name:"Bygg- & renoveringsstädning",short:"Efter bygget – före nyckeln. Ståltorra ytor, dammfria hörn.",tagline:"Bygget är klart. Nu gör vi så att bostaden kan flyttas in i.",priceNote:"624,50 kr/tim eller 90 kr/m² utan RUT",img:"https://images.pexels.com/photos/4098322/pexels-photo-4098322.jpeg?auto=compress&cs=tinysrgb&fit=crop&h=627&w=1200",accent:"sage",icon:"helmet",duration:"4–8 h per omgång",intro:["Efter en renovering ligger det damm i varje spricka – cementfläckar, gips, spackel och byggskräp. Vår byggstädning ger bostaden en grundläge för inflyttning: vi städar i två omgångar och tar det sista dammet som syns i snedljus.","Vi samarbetar även med hantverkare och fastighe märkta städmedel, mikrofiberdukar för varje typ av yta, dammsugare med HEPA-filter och egen avloppsrens för våtrum. Har du egna medel, allergier eller husdjur anpassar vi rutinen efter det – utan extra kostnad."},{title:"Samma lag, fasta tider, full flexibilitet",body:"Vid löpande avtal får du samma städlag och samma tid varje gång. Behöver du byta dag räcker ett meddelande 24 timmar innan. Du kan pausa avtalet vid semestern och börja igen när du kommer hem – ingen bindningstid, bara en uppsägningstid på 30 dagar."}],checklist:["Dammsugning av alla golv, mattor och under möbler","Dammtorkning av lister, fönsterbrädor, hyllor och belysning","Disk, diskbänk, spishäll och köksarbetsytor","Torkning av mikro, utsida av ugn och kylskåpsdörr","Rengöring av dusch, handfat, toalett och spegel","Golvtvätt i våtrum och avtorkning av kalla ytor"],notIncluded:["Fönsterputsning utifrån (bokas separat eller som tillägg)","Inuti ugn, kylskåp och skåp (ingår i storstädning)","Tvätt, strykning och städning av personliga föremål"],tip:"Vill du ha ett jämnt resultat över hela året? Boka hemstädning varannan vecka – då hinner inget damm eller kalk bygga upp sig mellan tillfällena."},kontorstading:{promise:"Anmärkningar inom 7 dagar åtgärdas alltid kostnadsfritt.",sections:[{title:"Städning som följer er arbetsdag",body:"Vi städar när det passar er – tidigt på morgonen, under lunchen eller efter att sista personen gått hem. Med tydliga checklistor och en fast kontaktperson vet ni exakt vad som görs varje tillfälle och vad nästa avtal omfattar."},{title:"Frisk arbetsmiljö, färre sjukdagar",body:"Handtag, dörrknoppar, gemensamma kök och toaletter är där bakterierna samlas. Vi desinficerar de ytorna varje tillfälle och fyller på förbrukningsmaterial, så att kontoret känns fräscht även på fredagseftermiddagen."},{title:"En faktura, inga överraskningar",body:"Fasta priser per tillfälle, faktura med dragrätt och månadsvis uppföljning. Behöver ni städa extra inför kundbesök, flytt eller större möten löser vi det på kort varsel – utan att byta avtal."}],checklist:["Skrivbord, bordsskivor och stolar torkas av","Toaletter rengörs och förbrukningsmaterial fylls på","Kök, pentry och mikrovågsugn rengörs","Dammsugning av mattor och avtorkning av kargolv","Sopor töms och papper/byggavfall sorteras","Gemensamma ytor: entré, hiss och trapphus vid behov"],notIncluded:["Fönsterputsning i höga höjder utan stång (erbjuds separat)","Industriell golvvård och maskinpolering","IT-utrustning och personliga skrivbordsföremål"],tip:"Börja med två tillfällen per vecka i en månad – sedan justerar vi frekvensen efter hur kontoret faktiskt används."},fonsterputsning:{promise:"Anmärkningar inom 7 dagar åtgärdas alltid kostnadsfritt.",sections:[{title:"Ljus är hemmets billigaste lyft",body:"Rena fönster förändrar hur hela bostaden upplevs – färgerna kommer tillbaka, rummen känns större och du slipper den grå hinna som byggts upp under hösten. Vi putsar båda sidor av glaset, inklusive karmar, brädor och ramar."},{title:"Rätt teknik för rätt yta",body:"På höga fönster använder vi teleskopstång och rentvattenssystem som lämnar glaset helt fläckfritt utan att nå behöver klättra. För butiksglas och entréer putsar vi före öppning så att kunder möts av kristallklara ytor."},{title:"Inga droppar, inga spår",body:"Vi arbetar uppifrån och ner, torkar av varje ram och lämnar inga vattenlinjer på listerna. Självklart städar vi upp efter oss – inga hinkar, inga droppar på golvet, inget lämnat utom den ljusa utsikten."}],checklist:["Alla fönsterglas, både utsida och insida","Fönsterkarmar, ramar och fönsterbrädor","Dörrglas, speglar och glaspartier i entré","Torkning av lister runt fönstren","Kontroll i dagsljus ruta för ruta","Borttagning av spindelväv runt fönstren"],notIncluded:["Fönster som är spruckna eller skadade före putsning","Renovering av inbränd smuts eller cementfläckar","Höghusputsning med klättrare (vi rekommenderar specialpartner)"],tip:"Kombinera fönsterputsning med hemstädning – då rengörs fönstrens innanmäte samtidigt som vi redan är på plats."},flyttningsstading:{promise:"Anmärkningar inom 7 dagar åtgärdas alltid kostnadsfritt.",sections:[{title:"Redo för nyckeln – och depositionen",body:"Vid avlämning granskas bostaden mot hyresvärdens eller bostadsrättsföreningens checklista. Vår flyttningsstädning följer den strukturen, och vi lämnar en skriftlig städbeskrivning som du kan visa upp vid överlämningen."},{title:"Ingen missar ugnen",body:"Det är detaljerna som avgör: inuti ugnen, bakom spisen, under handfatet, golvbrunnen, ventilationen och taklister. Vi rengör skåp, garderober och vitvaror – givetvis på utsidan och insidan när de är tömda."},{title:"Snabb hjälp när det brådskar",body:"Flyttdatum kan ändras i sista stund. Vi har flexibla tider och kan ofta boka in flyttningsstädning inom 48 timmar – ibland samma dag. Behöver du hjälp med flyttstäd och bärhjälp samman dag fixar vi det med våra partners."}],checklist:["Inuti ugn, kylskåp och frys (vid tomma apparater)","Bakom spis, tvättmaskin och torktumlare","Alla skåp, garderober och hyllor rengörs inuti","Kalkborttagning i dusch, badkar och handfat","Golvbrunn, ventilation och taklister rengörs","Alla fönster putsas och en städbeskrivning lämnas"],notIncluded:["Bortforsling av möbler och större avfall","Flytt av möbler som väger mer än 25 kg per person","Målning, tapetsering och snickeriarbeten"],tip:"Töm bostaden helt innan städningen – då når vi varje hörn och du slipper att något pockas bort vid granskningen."},stortstading:{promise:"Anmärkningar inom 7 dagar åtgärdas alltid kostnadsfritt.",sections:[{title:"Ett hem som känns nytt",body:"Storstädning är vårt djupaste uppdrag. Vi börjar uppe och arbetar oss ner: taklister, väggar, fönster, skåp, ugn, kalk i badrum och golv som fått sig en ordentlig omgång. Det tar tid – men resultatet syns direkt."},{title:"Maskiner när händer inte räcker",body:"Vid behov tar vi med golvmaskin, mattvättmaskin och ångrengörare. Kalk, fett och inbrän xactly double: SEK 624.50/hour or SEK 90/m². Your selected area includes any additional spaces entered. The final price is confirmed in writing within 24 hours.",ar:"بدون RUT تكون الأسعار ضعفاً تماماً: 624.50 كرونة/ساعة أو 90 كرونة/م². تشمل المساحة المختارة المساحات الإضافية التي تدخلها. يُؤكد السعر النهائي كتابياً خلال 24 ساعة.",fa:"بدون RUT قیمت دقیقاً دو برابر است: ساعتی ۶۲۴٫۵۰ کرون یا متری ۹۰ کرون. مساحت انتخابی شامل فضاهای اضافی واردشده است. قیمت نهایی ظرف ۲۴ ساعت کتبی تأیید می‌شود."},Boka:{en:"Book",ar:"احجز",fa:"رزرو"},Läs:{en:"Read",ar:"اقرأ",fa:"بخوانید"},mer:{en:"more",ar:"المزيد",fa:"بیشتر"},från:{en:"from",ar:"من",fa:"از"}},kh=new WeakMap,jh=new WeakMap,Nh=["placeholder","title","aria-label","alt"];function Sh(i,u){if(u==="sv")return i;const c=i.match(/^\s*/)?.[0]??"",o=i.match(/\s*$/)?.[0]??"",m=i.trim().replace(/\s+/g," "),g=qy[m]?.[u];return g?`${c}${g}${o}`:i}function Ly(){const{language:i}=Es(),{pathname:u}=Ot(),c=j.useRef(null);return j.useEffect(()=>{const o=document.body;if(!o)return;const m=()=>{const v=document.createTreeWalker(o,NodeFilter.SHOW_TEXT,{acceptNode(f){const w=f.parentElement;return!w||!f.nodeValue?.trim()||w.closest("script, style, textarea, [data-no-translate]")?NodeFilter.FILTER_REJECT:(w.tagName==="OPTION"&&!w.hasAttribute("value")&&w.setAttribute("value",w.textContent??""),NodeFilter.FILTER_ACCEPT)}});let p;for(;p=v.nextNode();){const f=p.nodeValue??"";let w=kh.get(p);(!w||f!==w.original&&f!==w.translated)&&(w={original:f,translated:f},kh.set(p,w));const y=Sh(w.original,i);w.translated=y,p.nodeValue!==y&&(p.nodeValue=y)}o.querySelectorAll("[placeholder]").forEach(f=>g(f,i)),o.querySelectorAll("[aria-label], [title], [alt]").forEach(f=>g(f,i))},g=(v,p)=>{let f=jh.get(v);f||(f={});for(const w of Nh){const y=v.getAttribute(w);if(!y)continue;let z=f[w];(!z||y!==z.original&&y!==z.translated)&&(z={original:y,translated:y},f[w]=z);const V=Sh(z.original,p);z.translated=V,v.getAttribute(w)!==V&&v.setAttribute(w,V)}jh.set(v,f)};m(),c.current=window.setTimeout(m,120);const x=new MutationObserver(v=>{v.length!==0&&(c.current&&window.clearTimeout(c.current),c.current=window.setTimeout(m,120))});return x.observe(o,{subtree:!0,childList:!0,characterData:!0,attributes:!0,attributeFilter:Nh}),()=>{x.disconnect(),c.current&&window.clearTimeout(c.current)}},[i,u]),null}function Vy(){const i=j.useRef(null);return j.useEffect(()=>{let u=0;const c=()=>{u=0;const m=Math.max(1,document.documentElement.scrollHeight-window.innerHeight),g=Math.min(1,Math.max(0,window.scrollY/m));i.current&&(i.current.style.transform=`scaleX(${g})`)},o=()=>{u||(u=window.requestAnimationFrame(c))};return c(),window.addEventListener("scroll",o,{passive:!0}),window.addEventListener("resize",o,{passive:!0}),()=>{window.removeEventListener("scroll",o),window.removeEventListener("resize",o),u&&window.cancelAnimationFrame(u)}},[]),n.jsx("div",{className:"scroll-progress-track","aria-hidden":"true",children:n.jsx("div",{ref:i,className:"scroll-progress-bar"})})}const ri=[{slug:"checklista-flyttningsstading",title:"Checklista: flyttningsstädning från A till Ö",excerpt:"Nyckeln ska lämna, depositionen ska komma tillbaka. Här är den exakta checklista vi går igenom – och vad hyresvärden oftast kollar efter.",date:"12 mars 2026",category:"Tips & guider",readTime:"6 min",img:"https://images.pexels.com/photos/4498122/pexels-photo-4498122.jpeg?auto=compress&cs=tinysrgb&fit=crop&h=627&w=1200",author:"Abelia Team",role:"Städexperter",content:[{type:"p",text:"Ett tomt hem efter en flytt ser ofta bättre ut än det faktiskt är. Damm ligger i hörnen, kalk har satts i duschen och klistertållar har stannat på fönsterkarmarna. Hyresvärden eller nyckeltjänsten har oftast en egen checklista – och den består sällan av 'det ser fint ut'. Här är vad som faktiskt kollar efter, och hur du gör att det går fort."},{type:"h2",text:"1. Börja uppe – avsluta nere"},{type:"p",text:"All dammtorkning börjar högst upp i varje rum: taklister, lampor, väggöverskar och karmar. Då landar dammet på golvet och du undviker att städa två gånger. Många som städar själva glömmer listerna – det är en av de tre saker som syns först i en överlåtelse."},{type:"h2",text:"2. Badrummet är avgörande"},{type:"p",text:"Kalkbeläggningar i duschen, vid handfatet och runt toaletten är den vanligaste anledningen till att en städning godkänns inte. Använd ett kalkmedel som får sitta i minst fem minuter innan du rensar. Kika även bakom handfatet och under kranen – där växlar beläggningar sig snabbast."},{type:"h2",text:"3. Köket: inuti och bakom"},{type:"p",text:"Hyresvärden öppnar skåp. Det betyder att det syns: inuti dörren, på hyllorna och under skåpet. Ugnen städas med ett ugnmedel som får verka över natten om det är rejält. Spisen bakom, fläktens fält och kylskåpets baksida får inte heller glömmas."},{type:"h2",text:"4. Fönster & golv – sista steget"},{type:"p",text:"Fönstren putsas allra sist, och golven sveps eller moppas efter att allt damm fallit ner. Dammsug mattan även mot listerna – det är där det sista dammet samlas. I sista laget: en dammduk på ett bord i dagsljus. Syns dammet på den, syns det för alla."},{type:"h2",text:"5. Dokumentera resultatet"},{type:"p",text:"Fotografera bostaden rum för rum – tomt och städat. Vid överlämning har du då ett kvitto på skicket, och om du anlitar oss lämnar vi dessutom en skriftlig städbeskrivning som du kan lämnar till hyresvärden eller nyckeltjänsten."},{type:"ul",items:["Boka 48 h före nyckel – det ger både er och oss en bra tid.","Kör ut all bostadsinventarier så syns dammet bäst.","Ha en dammduk redo för slutprovet i snedljus.","Spara städbeskrivningen tills depositionen kommit tillbaka."]}]},{slug:"tecken-hemmet-behover-en-storstading",title:"5 tecken på att hemmet behöver en ordentlig storstädning",excerpt:"Vardagsstädningen håller ytan. Men det finns signaler som säger att det är dags att gå djupare. Så upptäcker du att hemmet behöver ett grundläggande lyft.",date:"28 februari 2026",category:"Städtips",readTime:"4 min",img:"https://images.pexels.com/photos/4098925/pexels-photo-4098925.jpeg?auto=compress&cs=tinysrgb&fit=crop&h=627&w=1200",author:"Maja Lindgren",role:"Huvudstäderska",content:[{type:"p",text:"En vanlig hemstädning underhåller. Men varje hem har en punkt där 'renovering' inte längre räcker – då behöver man en storstädning. Efter tusentals hem som vi städat kan vi känna igen signalerna snabbt. Här är de fem vanligaste."},{type:"h2",text:"1. Duschväggen har 'milkatja'"},{type:"p",text:"Den gråa, matta filmen på glas och kakel är kalk som sätter sig lager på lager. Efter ett par år sitter den så pass hårt att den inte kan torkas – den måste renoveras bort med medel som får verka. När tvålspön torkar in till en film under en timme: det är dags."},{type:"h2",text:"2. Golvet glansar även efter dammsugning"},{type:"p",text:"Finns det en dammring vid listerna och en grå skugga under soffan även direkt efter dammsugning, är det dags för en golvgodgörare eller en maskinrensning. Det lagret sitter djupare än vad någon städmopp når vardagligen."},{type:"h2",text:"3. Köksskåpen luktar"},{type:"p",text:"Doften kommer oftast från hyllbotten, inuti dörren och under diskbänken. När du öppnar ugnen och ser det som låg kvar från i fjol, har ugnen också sagt sitt. Inuti ytor är precis det som ingår i vår storstädning – och sällan i en hemstädning."},{type:"h2",text:"4. Ljuset känns grått"},{type:"p",text:"Lyser ljuset genom fönstret men rummet känns ändå trött, är det oftast fönstren, lamporna och listerna som filterat in dammet. Ett hem med rutschade fönster och dammfria lister ljusnar märkbart – ibland behöver man inte ens byta gardiner."},{type:"h2",text:"5. Du städar snabbare för att det inte känns 'rätt'"},{type:"p",text:"Det är tecknet vi gillar bäst: din egen känsla. När du börjar skippa hörnen och städar i cirkel istället för i rum, vet hemmets invånare redan att det behöver ett grundläggande lyft."},{type:"p",text:"Vår rekommendation: storstäda 1–2 gånger per år, gärna inför jul och vår. Sedan håller en löpande hemstädning eller egen vardagsrutin resultatet hela året."}]},{slug:"sa-valjer-du-ett-stadforetag",title:"Så väljer du ett städföretag du kan lita på",excerpt:"Lågt pris på Facebook, oklara avtal och städare som aldrig blir desamma. Fem frågor som sorterar bort riskerna – innan du bokat.",date:"14 februari 2026",category:"Råd",readTime:"5 min",img:"https://images.pexels.com/photos/6197121/pexels-photo-6197121.jpeg?auto=compress&cs=tinysrgb&fit=crop&h=627&w=1200",author:"Elin Aro",role:"VD & grundare",content:[{type:"p",text:"Det finns många städföretag i Borås och Göteborg, och priserna skiljer sig mycket. Skillnaden mellan 200 kr och 500 kr för en hemstädning handlar sällan om 'fler mopp'. Det handlar om försäkring, skatter, utbildning och hur mycket som ingår i priset. Här är frågorna vi själva skulle ställa."},{type:"h2",text:"1. Har företaget F-skatt och hur ser arbetsmodellen ut?"},{type:"p",text:"Be om att få se F-skattsedel eller org.nr på bolaget som fakturor – inte på 'partnern som utför jobbet'. Många billiga aktörer är i praktiken privatpersoner som jobbar utan avdrag för arbetsgivaravgifter. Det är en risk för både dig och samhället."},{type:"h2",text:"2. Vad ingår exakt i priset?"},{type:"p",text:"Material, resan, skåp – ingår det? 'Pris exkl. material' kan snabbt dubbla den totala kostnaden. Vid oss är priset alltid fast och material ingår – du får ett pris du kan lita på, inte en uppskattning som växer vid kassan."},{type:"h2",text:"3. Är städarna försäkrade och utbildade?"},{type:"p",text:"Rensar du nyckeln och städaren skadar ett fönster? Då vill du att företaget har en ansvarsförsäkring och att städaren är anställd – inte en 'uppdragstagare' som försvinner. Fråga rakt ut, och be ett skriftligt svar."},{type:"h2",text:"4. Finns det en rutin kring kvalitet?"},{type:"p",text:"Bra företag jobbar med checklista och har en enkel väg att åtgärda. Fråga: 'Om det inte blev som tänkt – vad händer?' Hos oss åtgärdas anmärkningar kostnadsfritt inom 7 dagar – vi kommer tillbaka och rättar till."},{type:"h2",text:"5. Känner du igen dig i kontakten?"},{type:"p",text:"Om förfrågan tar tre dagar och svaren är vagt, bli det sällan bättre. Ett företag du kan lita på svarar inom ett par timmar, ger fast pris och berättar vem som kommer med bild och namn. Det ligger i grunden – i allt annat medföljer."},{type:"p",text:"Och kom ihåg: billigast är oftast dyrast. Räkna inte bara med priset per städning – räkna med försäkring, garanti och trygghet som en del av kostnaden."}]},{slug:"loopande-stading-sa-planerar-du-rutinen",title:"Löpande städning: så planerar du rutinen som passar ditt hem",excerpt:"Varje vecka eller varannan? Samma städlag, fasta tider och rabatt – så tänker du fram en rutin som faktiskt håller över tid.",date:"31 januari 2026",category:"Inspiration",readTime:"5 min",img:"https://images.pexels.com/photos/7513158/pexels-photo-7513158.jpeg?auto=compress&cs=tinysrgb&fit=crop&h=627&w=1200",author:"Maja Lindgren",role:"Huvudstäderska",content:[{type:"p",text:"Den bästa städrutinen är den som håller. Inte den mest effektiva, inte den billigaste – den som fortfarande fungerar efter tolv månader. Det handlar om frekvens, tider och att ha samma lag som lär sig ditt hem."},{type:"h2",text:"Välj frekvens efter hushåll – inte efter kalender"},{type:"ul",items:["En person / tvåa: varannan vecka räcker oftast.","Två personer / trea: varannan vecka, gärna med maskinrensning kvartalsvis.","Familj med barn och/eller husdjur: varje vecka ger bäst resultat.","Kontor: oftast 1–3 gånger per vecka beroende på antal medarbetare."]},{type:"h2",text:"Fasta tider, samma lag"},{type:"p",text:"Vid löpande städning får du alltid samma städlag. Efter tre tillfällen känner lag ditt hem: var det dammar, vad som irriterar dig, vilka medel som fungerar bäst. Resultatet blir snabbare och bättre – och du slipper förklara från början varje gång."},{type:"h2",text:"Tiden spelar roll"},{type:"p",text:"Boka gärna ett tidfönster som blir samma varje gång. Många kunder väljer morgon – hemmet är rent innan dagen börjar – medan andra föredrar kväll efter barnen somnat. Vill du inte vara hemma? Vi arbetar med färdigkod och skickar städlagets namn och bild i förväg."},{type:"h2",text:"Vad ger löpande avtal hos oss?"},{type:"ul",items:["Samma tydliga pris vid varje tillfälle","Samma städlag och fasta tider","En fri fönsterputsning per år","Prioriterad tidsbokning och flexibel ändring med 24 h","Ingen bindningstid – säg upp med 30 dagar"]},{type:"p",text:"Vår bästa regel: börja med en enskild städning, testa rytmen och gå därefter över till löpande om det känns rätt. Då vet du exakt vad du får – innan du bokar in det löpande."}]}],Gy=i=>ri.find(u=>u.slug===i);function Y({children:i,className:u,delay:c=0,as:o="div"}){const m=j.useRef(null),[g,x]=j.useState(!1);j.useEffect(()=>{const p=m.current;if(!p)return;if(window.matchMedia("(prefers-reduced-motion: reduce)").matches){x(!0);return}const f=new IntersectionObserver(w=>{w.forEach(y=>{y.isIntersecting&&(x(!0),f.unobserve(y.target))})},{threshold:.12,rootMargin:"0px 0px -40px 0px"});return f.observe(p),()=>f.disconnect()},[]);const v=o;return n.jsx(v,{ref:m,className:ee("reveal",g&&"is-visible",u),style:{"--reveal-delay":`${c}ms`},children:i})}const Yy=[{n:"01",title:"Välj tjänst",text:"Hemstädning, fönsterputsning, flytt eller kontoret – börja med vad hemmet behöver.",accent:"sage"},{n:"02",title:"Ange detaljer",text:"Privat eller företag, ytan i m² och eventuella tillägg. Vi räknar ut ett fast pris direkt.",accent:"lav"},{n:"03",title:"Välj datum & tid",text:"Plocka ett tidfönster som passar – vi kan oftast boka in inom 48 timmar.",accent:"blush"},{n:"04",title:"Bekräfta & slappna av",text:"Du får ett bekräftelsemeddelande med städlagets namn och bild. Vi städar, du godkänner.",accent:"butter"}],Qy=[{name:"Sara Lindqvist",area:"Borås",service:"Löpande hemstädning",text:"Tredje året med Abelia och fortfarande samma lag, samm
